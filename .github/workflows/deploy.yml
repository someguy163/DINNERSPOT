name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 서버의 deploy.php 가 GitHub 에서 zip 을 받아 푼다. 여기서는 그걸 한 번 부르기만 한다.
      # 응답에 성공 문구가 없으면 실패로 끝낸다 — InfinityFree 무료 등급은 봇 차단이 있어
      # curl 에 JS 챌린지 페이지를 돌려줄 수 있고, 그러면 배포가 안 됐는데 초록으로 보인다.
      # ponytail: 챌린지에 걸리면 수동 배포(브라우저로 deploy.php 열기)로 돌아간다.
      - run: |
          curl -fsS --max-time 180 "${{ secrets.DEPLOY_URL }}" -o out.html
          grep -q '배포되었습니다' out.html || { echo '--- 응답 ---'; head -c 2000 out.html; exit 1; }
